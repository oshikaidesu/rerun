[package]
name = "visibility-query-research"
version = "0.1.0"
edition = "2024"
[workspace]
[dependencies]
wgpu = "=29.0.4"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
